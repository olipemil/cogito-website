---
layout: default
---

<!-- Main content with right sidebar -->
<div class="rtd-content-wrapper">
  <main class="rtd-main">
    {{ content }}
  </main>

  <!-- Right Sidebar - Table of Contents -->
  <aside id="toc-sidebar" role="navigation">
    <div class="toc-container">
      <h3>On this page</h3>
      <ul class="toc-list" id="page-toc">
        <!-- TOC will be populated by JavaScript -->
      </ul>
    </div>
  </aside>
</div>

<style>
/* --- Content wrapper with right sidebar --- */
.rtd-content-wrapper {
  display: flex;
  position: relative;
}

/* --- Main content area (properly aligned with default layout) --- */
.rtd-main {
  line-height: 1.4;
}

/* Only apply right margin when right sidebar is visible */
@media (min-width: 1201px) {
  .rtd-main {
    margin-right: 240px; /* space for right sidebar */
    padding: 0 20px 0 0; /* minimal padding, default handles left margin */
  }
}

/* --- Right sidebar - Table of Contents --- */
#toc-sidebar {
  width: 200px;
  padding: 20px;
  background-color: #fafafa;
  border-left: 1px solid #e0e0e0;
  position: fixed;
  top: 0;
  right: 0;
  height: 100vh;
  overflow-y: auto;
  z-index: 50;
}

/* Hide right sidebar on narrow screens */
@media (max-width: 1200px) {
  #toc-sidebar {
    display: none;
  }
}

.toc-container h3 {
  font-size: 14px;
  font-weight: bold;
  color: #555;
  margin-bottom: 15px;
  margin-top: 20px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  border-bottom: 1px solid #ddd;
  padding-bottom: 5px;
}

/* --- Table of Contents with Dropdown --- */
.toc-list {
  list-style: none;
  padding-left: 0;
  margin-top: 10px;
  font-size: 12px;
}

.toc-list li {
  margin: 2px 0;
}

.toc-list a {
  color: #666;
  text-decoration: none;
  padding: 3px 8px;
  display: block;
  border-radius: 2px;
  transition: all 0.2s ease;
}

.toc-list a:hover {
  color: #2980b9;
  background-color: #f0f7ff;
}

/* Class entries with dropdown toggle */
.toc-class-item {
  position: relative;
}

.toc-class {
  font-weight: bold;
  color: #1c4e6e;
  margin-top: 8px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 4px 8px;
  background-color: #f5f6f7;
  border-radius: 3px;
  border: 1px solid #e1e5e9;
}

.toc-class:hover {
  background-color: #e8f4f8;
  color: #2980b9;
}

.toc-class-toggle {
  font-size: 10px;
  transition: transform 0.2s ease;
  color: #666;
}

.toc-class-toggle.expanded {
  transform: rotate(90deg);
}

/* Methods list under classes */
.toc-methods {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.4s ease;
  margin-left: 10px;
  border-left: 2px solid #e8f4f8;
  padding-left: 8px;
}

.toc-methods.expanded {
  max-height: 2000px; /* Much larger limit to accommodate all methods */
}

.toc-method {
  color: #555;
  font-size: 11px;
  padding: 2px 8px;
  margin: 1px 0;
}

.toc-method:hover {
  color: #2980b9;
  background-color: #f8f9fa;
}

<style>
/* --- Section headers --- */
.rtd-main h1, 
.rtd-main h2, 
.rtd-main h3 {
  padding: 0.1em 0.2em;
  background-color: #eef3f7;
  border-left: 4px solid #2980b9;
  margin-top: 0.2em;
}

/* --- Class blocks --- */
.rtd-main dl.py.class {
  background-color: transparent;
  padding: 0.0em;
  margin: 0.2em 0;
  border-radius: 1px;
  position: relative;
}
/* Class signature line */
.rtd-main dl.py.class > dt {
  font-family: monospace;
  font-weight: bold;
  color: #000000; /* black for class name */
  background-color: #92b9d1;
  padding: 0.4em;
  border-radius: 1px;
  border-top: 3px solid #1c4e6e
  line-height: 1.1;
}

/* Class definition parameters */
.rtd-main dl.py.class > dt .sig-param {
  color: #dfefff; /* lighter blue */
  font-size: 0.9em;
}

/* Class prefix styling (e.g., 'class') */
.rtd-main dl.py.class > dt .property {
  color: #666; /* gray color */
  font-size: 0.95em;
}

/* --- Method blocks --- */
.rtd-main dl.py.method {
  background-color: transparent;
  padding: 0;
  margin: 15px 0 10px 0; /* Increased spacing between method sections */
  border-radius: 1px;
}

/* Method signature line */
.rtd-main dl.py.method > dt {
  font-family: monospace;
  font-weight: bold;
  font-style: normal;
  color: #000000;
  background-color: #e8eaeb;
  padding: 0.4em;
  border-radius: 1px;
  border-left: 3px solid #4c7791;
  margin-bottom: 5px; /* Small gap between method signature and description */
  line-height: 1.05;
  display: inline-block; /* Only background up to text width */
  width: auto; /* Don't stretch to full width */
}

/* Function inner details */
.rtd-main dl.py.method > dt .sig-param {
  color: #768760; /* light green text */
  font-size: 0.9em;
}

/* Method prefix styling (e.g., 'static', 'classmethod') */
.rtd-main dl.py.method > dt .property {
  color: #666; /* gray color */
  font-size: 0.95em;
}

/* Source callout styling */
.rtd-main .viewcode-link {
  font-size: 0.9em;
  margin-left: 15px; /* Space further from end */
}

.rtd-main dl.py.class > dt .viewcode-link {
  font-size: 0.9em;
  margin-left: 15px; /* Space further from end */
}

.rtd-main dl.py.method > dt .viewcode-link {
  font-size: 0.9em;
  margin-left: 15px; /* Space further from end */
}

/* Hide extra square symbol after [source] links */
.rtd-main .headerlink {
  display: none; /* Remove the extra square symbol */
}

/* Method description content */
.rtd-main dl.py.method > dd {
  margin-left: 0; /* Remove excessive left indentation */
  padding-left: 10px; /* Add smaller left padding for alignment */
  margin-top: 5px; /* Reduced space between signature and description */
  margin-bottom: 0; /* Remove bottom margin */
  font-style: normal; /* Ensure normal text, not italic */
}

/* Method description paragraphs */
.rtd-main dl.py.method > dd > p {
  margin: 5px 0; /* Reduce paragraph spacing */
  padding: 0;
  line-height: 1.2;
  font-style: normal; /* Ensure normal text, not italic */
}

/* Parameter field lists - ReadTheDocs style inline formatting */
.rtd-main dl.py.method .field-list {
  margin-top: 8px;
  margin-bottom: 0;
  font-style: normal;
}

/* Simple inline approach for all field types */
.rtd-main dl.py.method .field-list dt.field-odd,
.rtd-main dl.py.method .field-list dt.field-even {
  display: inline-block;
  width: 100px;
  margin: 0;
  padding: 0;
  font-style: normal;
  font-weight: bold;
  vertical-align: top;
}

.rtd-main dl.py.method .field-list dd.field-odd,
.rtd-main dl.py.method .field-list dd.field-even {
  display: inline-block;
  width: calc(100% - 110px);
  margin: 0;
  padding: 0 0 0 0px; /* Add left padding here instead of later */
  font-style: normal;
  vertical-align: top;
}

/* Add spacing between sections */
.rtd-main dl.py.method .field-list dt.field-even {
  margin-top: 8px;
}

/* Fix Returns/Return type content alignment */
.rtd-main dl.py.method .field-list dd.field-even {
  margin-top: 8px; /* Match the dt margin to align properly */
}

/* Note: padding-left and width now handled in main dd rule above */

/* Parameter list items - remove extra margins and padding since parent has padding */
.rtd-main dl.py.method .field-list dd.field-odd ul.simple {
  margin: 0;
  padding-left: 10px; /* Add back some padding for bullet lists */
  line-height: 1.3;
  font-style: normal;
}

/* Regular description text (non-bullet) should be further left */
.rtd-main dl.py.method .field-list dd.field-odd > p,
.rtd-main dl.py.method .field-list dd.field-even > p {
  margin-left: -20px; /* Move description text further left */
}

.rtd-main dl.py.method .field-list dd.field-odd ul.simple li {
  margin: 2px 0;
  padding: 0;
  line-height: 1.1;
  font-style: normal;
}

.rtd-main dl.py.method .field-list dd.field-odd ul.simple li p {
  margin: 0;
  padding: 0;
  line-height: 1.1;
  font-style: normal;
}

</style>

</style>

<!-- JavaScript for dynamic table of contents with dropdown -->
<script>
document.addEventListener('DOMContentLoaded', function() {
    const tocContainer = document.getElementById('page-toc');
    if (!tocContainer) return;

    const mainContent = document.querySelector('.rtd-main');
    if (!mainContent) return;

    // Find all class and method definitions
    const classElements = mainContent.querySelectorAll('dl.py.class');

    let tocHTML = '';
    let classStructure = {};

    // Build class structure with methods
    classElements.forEach(function(classEl) {
        const classHeader = classEl.querySelector('dt');
        if (classHeader) {
            const className = classHeader.textContent.split('(')[0].split('.').pop();
            const classId = classHeader.id || 'class-' + className.toLowerCase();

            classStructure[className] = {
                id: classId,
                methods: []
            };

            // Find all methods in the class's dd container
            const classDd = classEl.querySelector('dd');
            if (classDd) {
                const methodElements = classDd.querySelectorAll('dl.py.method');
                methodElements.forEach(function(methodEl) {
                    const methodHeader = methodEl.querySelector('dt');
                    if (methodHeader) {
                        const methodName = methodHeader.querySelector('.sig-name');
                        if (methodName) {
                            const methodId = methodHeader.id || 'method-' + methodName.textContent.toLowerCase();
                            classStructure[className].methods.push({
                                name: methodName.textContent,
                                id: methodId
                            });
                        }
                    }
                });
            }
        }
    });

    // Generate HTML with dropdown structure
    Object.keys(classStructure).forEach(function(className) {
        const classData = classStructure[className];
        const classId = 'toc-class-' + className.toLowerCase();

        tocHTML += `
            <li class="toc-class-item">
                <div class="toc-class" onclick="toggleClassMethods('${classId}')">
                    <a href="#${classData.id}" onclick="event.stopPropagation()">${className}</a>
                    <span class="toc-class-toggle" id="${classId}-toggle">▶</span>
                </div>
                <ul class="toc-methods" id="${classId}-methods">
        `;

        classData.methods.forEach(function(method) {
            tocHTML += `<li><a href="#${method.id}" class="toc-method">${method.name}</a></li>`;
        });

        tocHTML += `
                </ul>
            </li>
        `;
    });

    if (tocHTML) {
        tocContainer.innerHTML = tocHTML;
    }

    // Smooth scrolling for TOC links
    tocContainer.addEventListener('click', function(e) {
        if (e.target.tagName === 'A') {
            e.preventDefault();
            const targetId = e.target.getAttribute('href').substring(1);
            const targetElement = document.getElementById(targetId);
            if (targetElement) {
                targetElement.scrollIntoView({ behavior: 'smooth' });
            }
        }
    });
});

// Function to toggle class methods dropdown
function toggleClassMethods(classId) {
    const methodsList = document.getElementById(classId + '-methods');
    const toggle = document.getElementById(classId + '-toggle');

    if (methodsList && toggle) {
        if (methodsList.classList.contains('expanded')) {
            // Closing the dropdown
            methodsList.classList.remove('expanded');
            methodsList.style.maxHeight = '0px';
            toggle.classList.remove('expanded');
        } else {
            // Opening the dropdown
            // Calculate actual height needed for smooth animation
            methodsList.style.maxHeight = 'none';
            const actualHeight = methodsList.scrollHeight;
            methodsList.style.maxHeight = '0px';

            // Force reflow then animate to actual height
            methodsList.offsetHeight;
            methodsList.classList.add('expanded');
            methodsList.style.maxHeight = actualHeight + 'px';
            toggle.classList.add('expanded');
        }
    }
}
</script>
