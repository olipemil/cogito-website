---
layout: default
---

<div id="content-wrapper">
  <!-- Sidebar (identical to default.html) -->
  <aside id="sidebar" role="navigation">
    <h2 class="site-title">{{ site.title | default: site.github.repository_name }}</h2>
    <nav class="site-nav">
      <ul>
        {% for item in site.data.navigation %}
        <li>
          <a href="{{ item.url | relative_url }}">{{ item.title }}</a>
        </li>
        {% endfor %}
      </ul>
    </nav>
  </aside>

  <!-- Main content -->
  <main id="main-content" role="main" class="rtd-main">
    {{ content }}
  </main>
</div>

<style>
/* --- Match sidebar to default.html --- */
#sidebar {
  width: 220px; /* consistent with default */
  padding: 20px;
  background-color: #f8f8f8;
  border-right: 1px solid #ddd;
}

#sidebar .site-nav ul {
  list-style: none;
  padding-left: 0;
}

#sidebar .site-nav li {
  margin: 0.4em 0;
}

#sidebar .site-nav a {
  text-decoration: none;
  color: #333;
  font-weight: 500;
}

/* --- Main text area aligned with default --- */
.rtd-main {
  margin-left: 240px; /* same offset as default.html */
  padding: 30px;
  max-width: 900px;
  line-height: 1.2;
  margin: 0.2em;
}

<style>
/* --- Section headers --- */
.rtd-main h1, 
.rtd-main h2, 
.rtd-main h3 {
  padding: 0.1em 0.2em;
  background-color: #eef3f7;
  border-left: 4px solid #2980b9;
  margin-top: 0.2em;
}

/* --- Class blocks --- */
.rtd-main dl.py.class {
  background-color: transparent;
  padding: 0.0em;
  margin: 0.2em 0;
  border-radius: 1px;
  position: relative;
}
/* Class signature line */
.rtd-main dl.py.class > dt {
  font-family: monospace;
  font-weight: bold;
  color: #000000; /* black for class name */
  background-color: #92b9d1;
  padding: 0.4em;
  border-radius: 1px;
  border-top: 6px solid #1c4e6e
}

/* Class definition parameters */
.rtd-main dl.py.class > dt .sig-param {
  color: #dfefff; /* lighter blue */
  font-size: 0.8em;
}

/* --- Method blocks --- */
.rtd-main dl.py.method {
  background-color: transparent;
  padding: 0.4em;
  margin: 0.4em 0;
  border-radius: 1px;
}

/* Method signature line */
.rtd-main dl.py.method > dt {
  font-family: monospace;
  font-weight: bold;
  font-style: normal;
  color: #000000;
  background-color: #e8eaeb;
  padding: 0.4em;
  border-radius: 1px;
  border-left: 5px solid #4c7791;
}

/* Function inner details */
.rtd-main dl.py.method > dt .sig-param {
  color: #768760; /* light green text */
  font-size: 0.8em;
}

</style>

</style>
