---
layout: default
---

<div id="content-wrapper">
  <!-- Sidebar (identical to default.html) -->
  <aside id="sidebar" role="navigation">
    <h2 class="site-title">{{ site.title | default: site.github.repository_name }}</h2>
    <nav class="site-nav">
      <ul>
        {% for item in site.data.navigation %}
        <li>
          <a href="{{ item.url | relative_url }}">{{ item.title }}</a>
        </li>
        {% endfor %}
      </ul>
    </nav>
  </aside>

  <!-- Main content -->
  <main id="main-content" role="main" class="rtd-main">
    {{ content }}
  </main>
</div>

<style>
/* --- Match sidebar to default.html --- */
#sidebar {
  width: 220px; /* consistent with default */
  padding: 20px;
  background-color: #f8f8f8;
  border-right: 1px solid #ddd;
}

#sidebar .site-nav ul {
  list-style: none;
  padding-left: 0;
}

#sidebar .site-nav li {
  margin: 0.4em 0;
}

#sidebar .site-nav a {
  text-decoration: none;
  color: #333;
  font-weight: 500;
}

/* --- Main text area aligned with default --- */
.rtd-main {
  margin-left: 240px; /* same offset as default.html */
  padding: 30px;
  max-width: 900px;
}

/* --- ReadTheDocs style highlights --- */
.rtd-main .section {
  margin-bottom: 2em;
}

.rtd-main .section > h1,
.rtd-main .section > h2,
.rtd-main .section > h3 {
  padding: 0.3em 0.6em;
  background-color: #eef3f7; /* subtle blue for sections */
  border-left: 4px solid #2980b9;
  margin-top: 1.5em;
}

.rtd-main .function,
.rtd-main .class {
  background-color: #f7f7f7;
  border: 1px solid #ddd;
  padding: 0.8em;
  margin: 1.2em 0;
  border-radius: 4px;
}

.rtd-main pre {
  background-color: #2b2b2b;
  color: #f8f8f2;
  padding: 10px;
  border-radius: 4px;
  overflow-x: auto;
}

/* Inline code */
.rtd-main code {
  background-color: #f2f2f2;
  padding: 0.1em 0.3em;
  border-radius: 3px;
}
<style>
/* --- Section headers --- */
.rtd-main h1, 
.rtd-main h2, 
.rtd-main h3 {
  padding: 0.1em 0.2em;
  background-color: #eef3f7;
  border-left: 4px solid #2980b9;
  margin-top: 1.5em;
}

/* --- Class blocks --- */
.rtd-main dl.py.class {
  background-color: #f2f9ff; /* light blue */
  border: 1px solid #cce5ff;
  padding: 0.2em;
  margin: 0.4em 0;
  border-radius: 6px;
  position: relative;
}

/* Add solid deep blue bar at top of class block */
.rtd-main dl.py.class > dt::before {
  content: "";
  display: block;
  height: 6px;
  background-color: #2980b9; /* deep blue */
  border-radius: 6px 6px 0 0;
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
}

/* Class signature line */
.rtd-main dl.py.class > dt {
  font-family: monospace;
  font-weight: bold;
  color: #000000; /* black for class name */
  background-color: #cad9b6;
  padding: 0.2em;
  border-radius: 4px;
  border-top: 8px solid #2980b9
}

/* Class definition parameters */
.rtd-main dl.py.class > dt .sig-param {
  color: #768760; /* lighter deep blue */
}

/* --- Method blocks --- */
.rtd-main dl.py.method {
  background-color: #f9f9f9; /* light gray */
  border: 1px solid #ddd;
  padding: 0.1em;
  margin: 0.4em 0;
  border-radius: 6px;
}

/* Method signature line */
.rtd-main dl.py.method > dt {
  font-family: monospace;
  font-weight: bold;
  color: #000000;
  background-color: #6fa4c9;
  padding: 0.2em;
  border-radius: 4px;
  border-left: 8px solid #1c4e6e;
}

/* Function inner details */
.rtd-main dl.py.method > dt .sig-param {
  color: #dfefff; /* light blue text */
}
</style>

</style>
