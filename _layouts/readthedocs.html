---
layout: default
---

<div id="content-wrapper">
  <!-- Sidebar (identical to default.html) -->
  <aside id="sidebar" role="navigation">
    <h2 class="site-title">{{ site.title | default: site.github.repository_name }}</h2>
    <nav class="site-nav">
      <ul>
        {% for item in site.data.navigation %}
        <li>
          <a href="{{ item.url | relative_url }}">{{ item.title }}</a>
        </li>
        {% endfor %}
      </ul>
    </nav>
  </aside>

  <!-- Main content -->
  <main id="main-content" role="main" class="rtd-main">
    {{ content }}
  </main>
</div>

<style>
/* --- Match sidebar to default.html --- */
#sidebar {
  width: 220px; /* consistent with default */
  padding: 20px;
  background-color: #f8f8f8;
  border-right: 1px solid #ddd;
}

#sidebar .site-nav ul {
  list-style: none;
  padding-left: 0;
}

#sidebar .site-nav li {
  margin: 0.4em 0;
}

#sidebar .site-nav a {
  text-decoration: none;
  color: #333;
  font-weight: 500;
}

/* --- Main text area aligned with default --- */
.rtd-main {
  margin-left: 240px; /* same offset as default.html */
  padding: 30px;
  max-width: 900px;
}

/* --- ReadTheDocs style highlights --- */
.rtd-main .section {
  margin-bottom: 2em;
}

.rtd-main .section > h1,
.rtd-main .section > h2,
.rtd-main .section > h3 {
  padding: 0.3em 0.6em;
  background-color: #eef3f7; /* subtle blue for sections */
  border-left: 4px solid #2980b9;
  margin-top: 1.5em;
}

.rtd-main .function,
.rtd-main .class {
  background-color: #f7f7f7;
  border: 1px solid #ddd;
  padding: 0.8em;
  margin: 1.2em 0;
  border-radius: 4px;
}

.rtd-main pre {
  background-color: #2b2b2b;
  color: #f8f8f2;
  padding: 10px;
  border-radius: 4px;
  overflow-x: auto;
}

/* Inline code */
.rtd-main code {
  background-color: #f2f2f2;
  padding: 0.1em 0.3em;
  border-radius: 3px;
}
<style>
/* --- Function blocks --- */
.rtd-main dl.py.function {
  background-color: #2980b9; /* deep blue */
  border: 1px solid #1f5f85;
  padding: 0.8em;
  margin: 1.2em 0;
  border-radius: 6px;
  color: #dfefff; /* light text inside */
  border-left: 6px solid #1c4e6e; /* vertical blue bar */
}

/* --- Function signature line --- */
.rtd-main dl.py.function > dt {
  font-family: monospace;
  font-weight: bold;
  font-style: normal; /* not italic */
  color: #ffffff; /* function name in white/bright */
  background: transparent;
  padding: 0.4em 0;
  border-radius: 0;
}

/* --- Inside function text (params, etc.) --- */
.rtd-main dl.py.function dd {
  color: #dfefff; /* lighter blue for details */
}

/* --- Class blocks --- */
.rtd-main dl.py.class {
  background-color: #f2f9ff; /* light blue */
  border: 1px solid #cce5ff;
  padding: 0.8em;
  margin: 1.2em 0;
  border-radius: 6px;
  position: relative;
}

/* --- Solid blue bar across top of class --- */
.rtd-main dl.py.class::before {
  content: "";
  display: block;
  height: 6px;
  background-color: #2980b9; /* deep blue */
  border-radius: 6px 6px 0 0;
  margin: -0.8em -0.8em 0 -0.8em; /* extend across container */
}

/* --- Class signature line --- */
.rtd-main dl.py.class > dt {
  font-family: monospace;
  font-weight: bold;
  font-style: normal;
  color: #000000; /* class name black */
  background: transparent;
  padding: 0.4em 0;
}

/* --- Variables in class definition (parameters after name) --- */
.rtd-main dl.py.class > dt .sig-param {
  color: #1c4e6e; /* lighter deep blue */
}
</style>

</style>
